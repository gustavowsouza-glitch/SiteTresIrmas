name: irmas-coqueiro

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APPROVAL_EMAIL: gustavo.wsouza@sacws.com.br
      ACCESS_MAIL_MODE: ${ACCESS_MAIL_MODE:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - store-data:/data
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "backup-service.mjs"]
    environment:
      BACKUP_DIR: /backups
    volumes:
      - store-data:/data:ro
      - ./backups:/backups
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  store-data:
